## *** xiaozhi-server/data/config_en.yaml as an English translation of xiaozhi-server/data/config.yaml ***

# #AK marks my specific costomizations

# In development, create a **data** directory in the project root, then create an empty file named **.config.yaml** in that directory
# To modify a configuration, edit the **.config.yaml** file instead of the **config.yaml** file
# The system will prioritize reading the configuration from **data/.config.yaml**; if a setting is missing there, it will fall back to **config.yaml**
# This approach simplifies configuration and protects your secrets.
# If you are using the ZhiKong platform, none of the following configurations will take effect; modify them in the ZhiKong console instead

# #####################################################################################
# #############################Server Basic Settings####################################
server:
  # Server listening address and port (Server listening address and port)
  ip: 0.0.0.0
  port: 8000
  # HTTP service port, used for simple OTA interfaces (single‑service deployment) and visual analysis interfaces
  http_port: 8003
  # WebSocket configuration for OTA interfaces sending to devices
  # By default the OTA interface automatically generates a WebSocket address and prints it in the startup log; you can open this address in a browser to verify the OTA interface
  # When deploying with Docker or using a public network (with SSL/domain), the generated address may be inaccurate
  # Therefore, if you are using Docker, set **websocket** to a local‑network address
  # If you are using a public network, set **websocket** to a public address
  # #AK original: websocket: ws://your.ip.or.domain:port.number/xiaozhi/v1/
  websocket: ws://AndreasKJN2.local:8000/xiaozhi/v1/
  # Visual analysis interface address
  # Address used to send visual analysis requests to devices
  # By default the system automatically generates a visual‑explanation address and prints it in the startup log; you can open this address in a browser to verify it
  # When deploying with Docker or using a public network, the address may be inaccurate
  # Therefore, if you are using Docker, set **vision_explain** to a local‑network address
  # If you are using a public network, set **vision_explain** to a public address
  # #AK original: vision_explain: http://your.ip.or.domain:port.number/mcp/vision/explain
  vision_explain: http://AndreasKJN2.local/mcp/vision/explain
  # Time‑zone offset for OTA response messages
  # #AK original: timezone_offset: +8
  timezone_offset: +1
  # Authentication configuration
  auth:
    # Whether authentication is enabled
    enabled: false
    # Whitelist of device IDs
    # Devices in this list bypass token verification and are allowed to connect directly
    allowed_devices:
      - "11:22:33:44:55:66"
  # MQTT gateway configuration, used to push commands to devices via OTA; format is host:port as defined in the **mqtt_gateway** .env file
  mqtt_gateway: null
  # MQTT signature key used to generate the MQTT password; must match the setting in the **mqtt_gateway** .env file
  mqtt_signature_key: null
  # UDP gateway configuration
  udp_gateway: null
log:
  # Log format for console output: timestamp, log level, tag, message
  log_format: "<green>{time:YYMMDD HH:mm:ss}</green>[{version}_{extra[selected_module]}][<light-blue>{extra[tag]}</light-blue>]-{level}-<light-green>{message}</light-green>"
  # Log format for file output: timestamp, version, module, logger name, level, tag, message
  log_format_file: "{time:YYYY-MM-DD HH:mm:ss} - {version}_{extra[selected_module]} - {name} - {level} - {extra[tag]} - {message}"
  # Log level: INFO, DEBUG, etc.
  log_level: INFO
  # Directory where log files are stored
  log_dir: tmp
  # Log file name
  log_file: "server.log"
  # Directory for data files
  data_dir: data

# Delete the audio file after it has been used
delete_audio: true
# Disconnect after no voice input for this many seconds (default 120 seconds = 2 minutes)
close_connection_no_voice_time: 120
# TTS request timeout (seconds)
tts_timeout: 10
# Enable wake‑word acceleration
enable_wakeup_words_response_cache: true
# Whether to reply with a wake‑up word sound at the beginning
enable_greeting: true
# Whether to play a notification sound after speaking
enable_stop_tts_notify: false
# Notification sound after speaking, audio file path
stop_tts_notify_voice: "config/assets/tts_notify.mp3"
# Enable WebSocket ping keep‑alive mechanism
enable_websocket_ping: false

# TTS audio‑sending delay configuration
# tts_audio_send_delay: Controls the interval between audio packets
#   0: Use precise timing, matching the audio frame rate (default; calculates based on audio frame rate at runtime)
#   >0: Use a fixed delay (in milliseconds); e.g., 60
tts_audio_send_delay: 0

exit_commands:
  - "Exit"
  - "Close"

xiaozhi:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    sample_rate: 16000
    channels: 1
    frame_duration: 60

# Module test configuration
module_test:
  test_sentences:
    - "Hello, please introduce yourself."
    - "What's the weather like today?"
    - "Please summarize the basic principle and application prospects of quantum computing in 100 words."

# Wake‑up words used to distinguish between wake‑up words and regular speech
wakeup_words:
  - "Hello, XiaoZhi"
  - "Computer"

# MCP endpoint address, format: ws://your.mcp.endpoint.ip.or.domain:port/mcp/?token=your.token
# Detailed guide: https://github.com/xinnan-tech/xiaozhi-esp32-server/docs/mcp-endpoint-integration_en.md
# mcp_endpoint: your.endpoint.websocket.address
