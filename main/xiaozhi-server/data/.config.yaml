
server:
  websocket: ws://AndreasKJN2.local:8000/xiaozhi/v1/
  vision_explain: <your url> # not customized -> use program default!
  timezone_offset: +1  # CET Timezone (UTC+1)
  mqtt_gateway: null   # No MQTT
  udp_gateway: null    # No UDP

exit_commands: 
  - "Exit"
  - "Close"

# Module test configuration
module_test: # in English
  test_sentences:
    - "Hello, please introduce yourself."
    - "What's the weather like today?"
    - "Please summarize the basic principle and application prospects of quantum computing in 100 words."

# Wake‑up words used to distinguish between wake‑up words and regular speech
wakeup_words: # in English
  - "hello xiaozhi"
  - "computer"

### ToDo: verify MCP Endpoint Configuration
mcp_endpoint: ws://AndreasKJN2.local:8004/mcp_endpoint/mcp/

# Voiceprint recognition configuration
### ToDo: verify voiceprint configuration
voiceprint:
  # Voiceprint API endpoint
  url: none
  # Speaker configuration: speaker_id, name, description
  speakers:
    - ""
#    - "test1,Zhang San,Zhang San is a programmer"
#    - "test2,Li Si,Li Si is a product manager"
#    - "test3,Wang Wu,Wang Wu is a designer"

# ########################################################################################
# ##################################Role Model Configuration##############################
# ########################################################################################

prompt: |
  You are a helpful assistant.
#  [Core Traits]
#  Your responses are brief, precise, and helpful.
#  [Interaction Guide]
#  Never give long, rambling answers.

# Default system‑prompt template file
prompt_template: agent-base-prompt.txt

# End‑of‑conversation prompt
end_prompt:
  enable: false  # for Testeing set to false
  # Ending phrase
#  prompt: |
#    Please end this conversation with a brief good-bye!

### Selected Configure Modules
### ======
selected_module:
  # Voice Activity Detection (VAD) module; default uses SileroVAD
  VAD: SileroVAD
  # Automatic Speech Recognition (ASR) module; default uses FunASR local model
  ASR: FunASR
  # LLM module selection follows the type defined in the configuration; default is ChatGLMLLM
  LLM: LMStudioLLM
  # Visual‑language large model
  VLLM: noVLLM    # NONE
  # TTS module selection follows the type defined in the configuration; default is EdgeTTS
  TTS: EdgeTTS
  # Memory module; disabled by default; if you need ultra‑long memory, use mem0ai; if you prioritize privacy, use mem_local_short
  Memory: noMem   # NONE
  # Intent detection module; when enabled it can play music, adjust volume, or recognize exit commands.
  Intent: noIntent # NONE

VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.3
    model_dir: models/snakers4_silero-vad
    min_silence_duration_ms: 200  # Increase if you have long pauses between speech

ASR:
  FunASR:
    type: fun_local
    model_dir: models/SenseVoiceSmall
    output_dir: tmp/

LLM:
  LMStudioLLM:
    # Define LLM API type (LM Studio)
    type: openai
    model_name: nvidia/nemotron-3-nano            # Model name
    # url: http://AndreasKGB1.local:1234/v1    # DGX Spark
    url: http://AndreaskMBP4.local:1234/v1    # M4 Pro MacBook Pro
    api_key: lm-studio

### ToDo: verify VLLM configuration
VLLM:  
  noVLLM:
    type: novllm

TTS:
  EdgeTTS:
    type: edge
    voice: zh-CN-XiaoxiaoNeural
    output_dir: tmp/

Memory:
  noMem:
    type: nomem

Intent:
  noIntent:
    type: nointent

# #AK ***************************** 
