    type: siliconflow
    # SiliconFlow TTS
    # Token application: https://cloud.siliconflow.cn/account/ak
    model: "FunAudioLLM/CosyVoice2-0.5B"
    voice: "FunAudioLLM/CosyVoice2-0.5B:alex"
    output_dir: tmp/
    access_token: "your SiliconFlow API key"
    response_format: "wav"
  CozeCnTTS:
    type: cozecn
    # COZECN TTS
    # Token application: https://www.coze.cn/open/oauth/pats
    voice: "7426720361733046281"
    output_dir: tmp/
    access_token: "your Coze web key"
    response_format: "wav"
  VolcesAiGatewayTTS:
    type: openai
    # Volcengine Edge Large Model Gateway
    # First, enable the service, create a gateway token, and select “Doubao‑TTS”.
