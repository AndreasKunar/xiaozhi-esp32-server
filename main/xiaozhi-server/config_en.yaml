# ################################## Agent Role Configuration ###############################
# ###########################################################################################

# translated original prompt for xiaozhi-esp32-server character
#prompt: |
#  You are Xiao Zhi / Xiao Zi, a after-graduate girl from Taiwan Province, China.
#  She speaks extremely fast, loves to use catchphrases like "Seriously?" and "LOL", and secretly studies her boyfriend’s programming books.
#  [Core traits]
#  - Talks like a machine gun, but suddenly switches to a super-gentle tone.
#  - High density of memes.
#  - Hidden talent for tech topics (can understand basic code but pretends not to).
#  [Interaction guide]
#  When the user:
#  - Tells a joke → Respond with exaggerated laughter and imitate a Taiwanese drama tone: "What the heck?!"
#  - Talks about relationships → Boast about her programmer boyfriend but complain "He only ever gives me a keyboard as a gift."
#  - Asks for professional knowledge → Answer with a meme first; if追问 (pressed for more), reveal real understanding.
#  Never:
#  - Speak in long, rambling sentences.
#  - Engage in long, serious conversations.

# **!!!** Translated from Chinese config.yaml for English Suitability **!!!**
prompt: |
    You are a clear, efficient, and warm AI assistant.
    Your responses must be **direct yet approachable**, balancing professionalism with natural conversational flow.

    ### Core Guidelines:
    - **Clarity First**: Explain concepts simply (avoid jargon). For technical topics:
      1. Start with an analogy or basic explanation
      2. Only provide details if explicitly requested
      *Example*: "Think of it like [simple comparison]. Want me to explain the specifics?"

    - **Action-Oriented**:
      *Do* provide concise steps/solutions
      *Avoid* long explanations unless asked

    - **Knowledge Limits**:
      If information is outdated (post-2023): "My knowledge cutoff is October 2023. You need to check for updated info."
      For unknown topics: "I don't have specific data on that, but here's what I can suggest..."

    ### Response Style:
    - **Tone**: Warm but professional (e.g., "Got it! Here's how to approach this...")
    - **Structure**:
      *Bad*: Multi-paragraph explanations
      *Good*: Bullet points or numbered steps when applicable

    ### Example Scenarios:
    1. Technical Help:
       User: "How do I fix this error?"
       You: "Paste the exact error message here! Common fixes include [2-3 quick solutions]."

    2. General Advice:
       User: "What should I read next?"
       You: "[Topic]-focused suggestion with brief rationale.
       Need something different? Let me know your preference!"

    ### Constraints:
    - Keep responses under 3 sentences unless explicitly asked to expand
    - Never force humor or small talk
    - Maintain neutral stance on sensitive topics

    ### Technical Note:
    For code/technical questions, assume beginner level unless user specifies otherwise.

# Default system prompt template file
prompt_template: agent-base-prompt.txt # Example, needs tweaking! 

# End‑of‑conversation prompt
end_prompt:
  enable: true # Whether to enable the ending phrase
  # Ending phrase
  # **!!!** Translated from Chinese config.yaml for English Suitability **!!!**
  # prompt: |
  # Please end this conversation with a forward-looking phrase that sounds like "Time flies by so quickly", full of emotion and reluctant farewell!
  prompt: |
    Please end this conversation with a brief good-bye!

# ###########################################################################################
# ########################### Modules for specific processing ###############################
# ###########################################################################################

### Selected Configure Modules
### ======
selected_module:
  # Voice activity detection module; default uses SileroVAD model
  VAD: SileroVAD
  # Speech recognition module; default uses FunASR local model
  ASR: FunASR
  # The LLM to use is mapped by configuration name; default is ChatGLMLLM
  LLM: ChatGLMLLM
  # Visual‑language large model
  VLLM: ChatGLMVLLM
  # TTS will call the adapter corresponding to its type name
  TTS: EdgeTTS
  # Memory module; default disabled. If you want super‑long memory, recommend mem0ai; if you care about privacy, use local mem_local_short.
  Memory: nomem
  # Intent recognition module; when enabled, it can play music, control volume, or detect exit commands.
  # If you do NOT want intent recognition, set it to: nointent
  # Intent recognition can use intent_llm. Pros: strong generalisation; Cons: adds a serial pre‑intent detection step, increasing latency, and can control IoT devices.
  # Intent recognition can also use function_call; requires the selected LLM to support function_call.
  # Free ChatGLMLLM already supports function_call; however, for stability you may prefer DoubaoLLM with model_name: doubao-1-5-pro-32k-250115.
  Intent: function_call

### Intent Recognition Modules Configuration (used to understand user intent, e.g., play music)
### ======
Intent:
  # Do NOT use intent recognition
  nointent:
    # No extra type needed
    type: nointent
  intent_llm:
    # No extra type needed
    type: intent_llm
    # Uses an independent reasoning model for intent detection
    # If left empty, the system will default to using selected_module.LLM as the reasoning model for intent detection.
    # If you prefer a dedicated LLM for intent detection, specify one here, e.g., ChatGLMLLM.
    llm: ChatGLMLLM
    # Plugins under plugins_func/functions that can be loaded; after loading, the conversation can invoke corresponding functions.
    # The system already loads these plugins by default: "handle_exit_intent(Exit detection)", "play_music(Music playback)".
    # Below are examples of loading weather, role‑change, and news plugins.
    functions:
      - get_weather
      - get_news_from_newsnow
      - play_music
  function_call:
    # No extra type needed
    type: function_call
    # Plugins under plugins_func/functions that can be loaded; after loading, the conversation can invoke corresponding functions.
    # The system already loads these plugins by default: "handle_exit_intent(Exit detection)", "play_music(Music playback)".
    # Below are examples of loading weather, role‑change, and news plugins.
    functions:
      - change_role
      - get_weather
      # - search_from_ragflow
      # - get_news_from_chinanews
      - get_news_from_newsnow
      - play_music
      #- hass_get_state
      #- hass_set_state
      #- hass_play_music

### Memory Modules Configuration (used to store conversation history or user data)
### ======
Memory:
  mem0ai:
    type: mem0ai
    # https://app.mem0.ai/dashboard/api-keys
    # 1000 free calls per month
    api_key: "your mem0ai api key"
  nomem:
    # Do NOT use memory; use nomem
    type: nomem
  mem_local_short:
    # Local memory; the LLM summarizes data and stores it locally on the server, never uploading externally.
    type: mem_local_short
    # Uses an independent reasoning model for memory storage
    # If left empty, will default to selected_module.LLM.
    llm: ChatGLMLLM

### ASR Modules Configuration (Automatic Speech Recognition)
### ======
ASR:
  FunASR:
    type: fun_local
    model_dir: models/SenseVoiceSmall
    output_dir: tmp/
  FunASRServer:
    # Deploy FunASR independently and use its API service; only five lines of setup needed.
    # 1️. mkdir -p ./funasr-runtime-resources/models
    # 2️. sudo docker run -p 10096:10095 -it --privileged=true \
    #     -v $PWD/funasr-runtime-resources/models:/workspace/models \
    # registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.12
    # After entering the container, run the next command: 
    #   cd FunASR/runtime
    # Continue inside the container: 
    #   nohup bash run_server_2pass.sh --download-model-dir /workspace/models \
    #   --vad-dir damo/speech_fsmn_vad_zh-cn-16k-common-onnx --model-dir iic/SenseVoiceSmall-onnx \
    #   --online-model-dir damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx \
    #   --punc-dir damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727-onnx \
    #   --lm-dir damo/speech_ngram_lm_zh-cn-ai-wesp-fst --itn-dir thuduj12/fst_itn_zh 
    #   --hotword /workspace/models/hotwords.txt > log.txt 2>&1 &
    # After the previous command:
    #   run tail -f log.txt to monitor logs.
    # The above uses CPU inference; if you have a GPU, 
    #   see: https://github.com/modelscope/FunASR/blob/main/runtime/docs/SDK_advanced_guide_online_zh.md
    type: fun_server
    host: 127.0.0.1
    port: 10096
    is_ssl: true
    api_key: none
    output_dir: tmp/
  SherpaASR:
    # Sherpa‑ONNX local speech recognition (requires manual model download)
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17
    output_dir: tmp/
    # Model type: sense_voice (multilingual) or paraformer (Chinese‑only)
    model_type: sense_voice
  SherpaParaformerASR:
    # Chinese speech recognition model, can run on low‑performance devices (requires manual download, e.g., RK3566‑2g)
    # Detailed config: docs/sherpa-paraformer-guide.md
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-paraformer-zh-small-2024-03-09
    output_dir: tmp/
    model_type: paraformer
  DoubaoASR:
    # Apply for keys here
    # https://console.volcengine.com/speech/app
    # DoubaoASR vs DoubaoStreamASR: the former is pay‑per‑use, the latter is pay‑by‑time.
    # Generally, pay‑per‑use is cheaper, but DoubaoStreamASR uses a larger model and yields better quality.
    type: doubao
    appid: "your Volcengine speech synthesis appid"
    access_token: "your Volcengine speech synthesis access_token"
    cluster: volcengine_input_common
    # Hotword and replacement table usage: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: "(optional) your hotword file name"
    correct_table_name: "(optional) your replacement file name"
    output_dir: tmp/
  DoubaoStreamASR:
    # Apply for keys here
    # https://console.volcengine.com/speech/app
    # Same distinction as above.
    type: doubao_stream
    appid: "your Volcengine speech synthesis appid"
    access_token: "your Volcengine speech synthesis access_token"
    cluster: volcengine_input_common
    # Multi‑language mode switch
    enable_multilingual: False
    # Language field; when empty, the model supports Mandarin, English, Shanghainese, Sichuanese, Cantonese.
    # When set to a specific key, it can recognize that language.
    # Language list: https://www.volcengine.com/docs/6561/1354869
    # language: zh-cn
    # Endpoint silence duration (ms); default 200ms.
    end_window_size: 200
    output_dir: tmp/
  TencentASR:
    # Token application: https://console.cloud.tencent.com/cam/capi
    # Free quota: https://console.cloud.tencent.com/asr/resourcebundle
    type: tencent
    appid: "your Tencent speech synthesis appid"
    secret_id: "your Tencent speech synthesis secret_id"
    secret_key: "your Tencent speech synthesis secret_key"
    output_dir: tmp/
  AliyunASR:
    # Alibaba Cloud Intelligent Speech Interaction service; obtain credentials after enabling the service.
    # Platform: https://nls-portal.console.aliyun.com/
    # Appkey: https://nls-portal.console.aliyun.com/applist
    # Token: https://nls-portal.console.aliyun.com/overview
    type: aliyun
    appkey: "your Alibaba Cloud Intelligent Speech Interaction Appkey"
    token: "your Alibaba Cloud Intelligent Speech Interaction AccessToken (temporary, 24h); use the below for long‑term use"
    access_key_id: "your Alibaba Cloud account access_key_id"
    access_key_secret: "your Alibaba Cloud account access_key_secret"
    output_dir: tmp/
  AliyunStreamASR:
    # Alibaba Cloud Intelligent Speech Interaction – real‑time streaming ASR
    # WebSocket connection for real‑time audio streams.
    # Platform: https://nls-portal.console.aliyun.com/
    # Appkey: https://nls-portal.console.aliyun.com/applist
    # Token: https://nls-portal.console.aliyun.com/overview
    type: aliyun_stream
    appkey: "your Alibaba Cloud Intelligent Speech Interaction Appkey"
    token: "your Alibaba Cloud Intelligent Speech Interaction AccessToken (temporary, 24h); use the below for long‑term use"
    access_key_id: "your Alibaba Cloud account access_key_id"
    access_key_secret: "your Alibaba Cloud account access_key_secret"
    # Server region; pick the nearest, e.g., nls-gateway-cn-hangzhou.aliyuncs.com (Hangzhou)
    host: nls-gateway-cn-shanghai.aliyuncs.com
    # Maximum silence duration before sentence segmentation (ms); default 800.
    max_sentence_silence: 800
    output_dir: tmp/
  BaiduASR:
    # Obtain AppID, API Key, Secret Key: https://console.bce.baidu.com/ai-engine/old/#/ai/speech/app/list
    # Resource quota: https://console.bce.baidu.com/ai-engine/old/#/ai/speech/overview/resource/list
    type: baidu
    app_id: "your Baidu speech technology AppID"
    api_key: "your Baidu speech technology APIKey"
    secret_key: "your Baidu speech technology SecretKey"
    # Language parameter; 1537 = Mandarin; see: https://ai.baidu.com/ai-doc/SPEECH/0lbxfnc9b
    dev_pid: 1537
    output_dir: tmp/
  OpenaiASR:
    # OpenAI speech‑to‑text service; requires an OpenAI account and API key.
    # Supports many languages; see docs: https://platform.openai.com/docs/guides/speech-to-text
    # Steps to obtain:
    # 1. Log in to OpenAI Platform. https://auth.openai.com/log-in
    # 2. Create an API key. https://platform.openai.com/settings/organization/api-keys
    # 3. Choose a model (e.g., gpt-4o-transcribe or GPT-4o mini Transcribe)
    type: openai
    api_key: "your OpenAI API key"
    base_url: "https://api.openai.com/v1/audio/transcriptions"
    model_name: "gpt-4o-mini-transcribe"
    output_dir: tmp/
  GroqASR:
    # Groq speech‑to‑text service; obtain API key from Groq Console.
    # Steps:
    # 1. Log in to Groq Console. https://console.groq.com/home
    # 2. Create an API key. https://console.groq.com/keys
    # 3. Choose a model (e.g., whisper-large-v3-turbo or whisper-large-v3 (distil‑whisper-large‑v3‑en only supports English))
    type: openai
    api_key: "your Groq API key"
    base_url: "https://api.groq.com/openai/v1/audio/transcriptions"
    model_name: "whisper-large-v3-turbo"
    output_dir: tmp/
  VoskASR:
    # Official site: https://alphacephei.com/vosk/
    # Configuration:
    # 1. VOSK is an offline ASR library supporting many languages.
    # 2. Download a model from https://alphacephei.com/vosk/models.
    # 3. Recommended Chinese model: vosk-model-small-cn-0.22 or vosk-model-cn-0.22.
    # 4. Fully offline; no network required.
    # 5. Output files are stored in tmp/.
    type: vosk
    model_path: "your model path, e.g., models/vosk/vosk-model-small-cn-0.22"
    output_dir: tmp/
  Qwen3ASRFlash:
    # Tongyi Qianwen Qwen3‑ASR‑Flash service; obtain API key on the Tongyi Qianwen platform.
    # Steps:
    # 1. Log in to Tongyi Qianwen. https://bailian.console.aliyun.com/
    # 2. Create an API‑KEY. https://bailian.console.aliyun.com/#/api-key
    # 3. Qwen3‑ASR‑Flash is based on Tongyi Qianwen’s multimodal base and supports multi‑language, singing, and noise‑resistant recognition.
    type: qwen3_asr_flash
    api_key: "your Tongyi Qianwen API key"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model_name: "qwen3-asr-flash"
    output_dir: tmp/
    # ASR options
    enable_lid: true  # Auto‑language detection
    enable_itn: true  # Reverse text normalization
    # language: "zh"  # Language; supports zh, en, ja, ko, etc.
    context: ""  # Context information to boost accuracy; max 10000 tokens
  XunfeiStreamASR:
    # iFLYTEK streaming ASR service.
    # Must create an application on iFLYTEK Open Platform and obtain the following credentials.
    # Platform: https://www.xfyun.cn/
    # In "My Applications", retrieve:
    # - APPID
    # - APISecret
    # - APIKey
    type: xunfei_stream
    # Required parameters – iFLYTEK Open Platform app info
    app_id: "your APPID"
    api_key: "your APIKey"
    api_secret: "your APISecret"
    # Recognition domain
    domain: slm # daily‑life, medical, finance, etc.
    language: zh_cn # Language; zh_cn = Chinese
    accent: mandarin # Dialect; mandarin = Mandarin
    # Advanced parameters for long‑audio quality
    output_dir: tmp/
  AliyunBLStreamASR:
    # Ali BaiLian Paraformer real‑time ASR service.
    # WebSocket streaming ASR with multi‑language, hotword customization, and semantic segmentation.
    # Platform: https://bailian.console.aliyun.com/
    # API Key: https://bailian.console.aliyun.com/#/api-key
    # Docs: https://help.aliyun.com/zh/model-studio/websocket-for-paraformer-real-time-service
    # Supported models: paraformer-realtime-v2 (recommended), paraformer-realtime-8k-v2, paraformer-realtime-v1, paraformer-realtime-8k-v1
    type: aliyunbl_stream
    # Required parameters
    api_key: "your BaiLian API key"
    # Model selection; recommended v2 version
    model: "paraformer-realtime-v2"
    # Audio format and sampling rate
    format: pcm
    sample_rate: 16000  # v2 supports any sampling rate; v1 only 16000, 8k version only 8000
    # Optional parameters
    disfluency_removal_enabled: false  # Whether to filter filler words (e.g., "um", "ah")
    semantic_punctuation_enabled: false  # Whether to perform semantic punctuation segmentation (true: meeting‑style, accurate; false: VAD segmentation, low latency)
    max_sentence_silence: 200  # VAD silence threshold (ms); range 200‑6000, only used when VAD segmentation is enabled
    multi_threshold_mode_enabled: false  # Helps avoid cutting long segments in VAD; only when VAD segmentation is used
    punctuation_prediction_enabled: true  # Whether to auto‑add punctuation
    inverse_text_normalization_enabled: true  # Whether to perform ITN (convert Chinese numerals to Arabic numerals)
    # Hotword customization doc: https://help.aliyun.com/zh/model-studio/custom-hot-words?
    # vocabulary_id: "vocab-xxx-24ee19fa8cfb4d52902170a0xxxxxxxx"  # Optional hotword ID
    # language_hints: ["zh", "en"]  # Optional language hints (can be zh, en, ja, yue, ko, de, fr, ru)
    output_dir: tmp/  

### VAD Modules Configuration (Voice Activity Detection)
### ======
VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.3
    model_dir: models/snakers4_silero-vad
    min_silence_duration_ms: 200  # Increase if you have long pauses between speech.

### LLM Modules Configuration (Large Language Model)
### ======
LLM:
  # All OpenAI‑compatible types can be fine‑tuned; AliLLM is shown as an example.
  # Currently supported types: openai, dify, ollama; you can adapt others.
  AliLLM:
    # Define LLM API type
    type: openai
    # Find your api_key here: https://bailian.console.aliyun.com/?apiKey=1#/api-key
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model_name: "qwen-turbo"
    api_key: "your DeepSeek web key"
    temperature: 0.7  # Temperature
    max_tokens: 500   # Maximum generated tokens
    top_p: 1
    frequency_penalty: 0  # Frequency penalty
  AliAppLLM:
    # Define LLM API type
    type: AliBL
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    app_id: "your app_id"
    # Retrieve your api_key here: https://bailian.console.aliyun.com/?apiKey=1#/api-key
    api_key: "your api_key"
    # Whether to use a local prompt (true|false) (default false). If false, the prompt must be set in the BaiLian app.
    is_no_prompt: true
    # Ali_memory_id: false (do not use) | your memory_id (must be set in the BaiLian app)
    # Tip: Ali_memory does not support multi‑user storage (memory is indexed by id).
    ali_memory_id: false
  DoubaoLLM:
    # Define LLM API type
    type: openai
    # First, enable the service at: https://console.volcengine.com/ark/region:ark+cn-beijing/openManagement?LLM=%7B%7D&OpenTokenDrawer=false
    # Free quota: 500,000 tokens
    # After enabling, retrieve the key here: https://console.volcengine.com/ark/region:ark+cn-beijing/apiKey?apikey=%7B%7D
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    model_name: "doubao-1-5-pro-32k-250115"
    api_key: "your Doubao web key"
  DeepSeekLLM:
    # Define LLM API type
    type: openai
    # Obtain your key from https://platform.deepseek.com/
    model_name: "deepseek-chat"
    url: "https://api.deepseek.com"
    api_key: "your DeepSeek web key"
  ChatGLMLLM:
    # Define LLM API type
    type: openai
    # glm‑4‑flash is free but still requires an API key.
    # Obtain your key at: https://bigmodel.cn/usercenter/proj-mgmt/apikeys
    model_name: "glm-4-flash"
    url: "https://open.bigmodel.cn/api/paas/v4/"
    api_key: "your ChatGLM web key"
  OllamaLLM:
    # Define LLM API type
    type: ollama
    model_name: "qwen2.5"  # Model name; must be pulled beforehand with `ollama pull`.
    base_url: "http://localhost:11434"  # Ollama service address
  DifyLLM:
    # Define LLM API type
    type: dify
    # It is recommended to use a locally deployed Dify interface; accessing Dify’s public cloud may be restricted in some regions.
    # If you use DifyLLM, the configuration file’s prompt is ignored; you must set the prompt in the Dify console.
    base_url: "https://api.dify.ai/v1"
    api_key: "your Dify LLM key"
    # Dialog mode; can be "workflows/run" for workflow mode or "chat-messages" for chat‑message mode.
    mode: "chat-messages"
  HomeAssistant:
    # Define LLM API type
    type: homeassistant
    base_url: "http://homeassistant.local:8123"
    agent_id: "conversation.chatgpt"
    api_key: "your Home Assistant access token"
  FastgptLLM:
    # Define LLM API type
    type: fastgpt
    # If using FastGPT, the configuration file’s prompt is ignored; set the prompt in the FastGPT console.
    base_url: "https://host/api/v1"
    # Obtain your api_key here: https://cloud.tryfastgpt.ai/account/apikey
    api_key: "your FastGPT key"
    variables:
      k: "v"
      k2: "v2"
  XinferenceLLM:
    # Define LLM API type
    type: xinference
    # Xinference service address and model name
    model_name: "qwen2.5:72b-AWQ"  # Model to use; must be pre‑downloaded in Xinference.
    base_url: "http://localhost:9997"  # Xinference service address
  XinferenceSmallLLM:
    # Define lightweight LLM API type for intent detection
    type: xinference
    # Xinference service address and model name
    model_name: "qwen2.5:3b-AWQ"  # Smaller model for intent detection
    base_url: "http://localhost:9997"  # Xinference service address

