### TTS Modules Configuration (Text‑to‑Speech)
### ======
TTS:
  # Currently supported types: edge, doubao; you can adapt others.
  EdgeTTS:
    # Define TTS API type
    type: edge
    voice: "zh-CN-XiaoxiaoNeural"
    output_dir: tmp/
  DoubaoTTS:
    # Define TTS API type
    type: doubao
    # Volcengine speech synthesis; requires appid and access_token.
    # Volcengine charges for usage; the free tier offers only 2 concurrent requests, which often leads to errors.
    # Purchase a plan at: https://console.volcengine.com/speech/service/8 (standard voices) or https://console.volcengine.com/speech/service/10007 (Hong Kong “Xiao He” voice).
    # After purchase, the voice name must be updated accordingly.
    api_url: "https://openspeech.bytedance.com/api/v1/tts"
    voice: "BV001_streaming"
    output_dir: tmp/
    authorization: "Bearer;"
    appid: "your Volcengine speech synthesis appid"
    access_token: "your Volcengine speech synthesis access_token"
    cluster: "volcano_tts"
    speed_ratio: 1.0
    volume_ratio: 1.0
    pitch_ratio: 1.0
  # Volcengine dual‑stream TTS (bidirectional WebSocket)
  HuoshanDoubleStreamTTS:
    type: huoshan_double_stream
    # Visit https://console.volcengine.com/speech/service/10007 to enable the large‑model TTS and purchase a voice.
    # In the page footer, obtain appid and access_token.
    # Resource ID is fixed: volc.service_type.10029 (large‑model TTS and mixing)
    # If using Linking (机智云), replace the endpoint with wss://bytedance.gizwitsapi.com/api/v3/tts/bidirection
    # Linking does not require appid.
    ws_url: "wss://openspeech.bytedance.com/api/v3/tts/bidirection"
    appid: "your Volcengine speech synthesis appid"
    access_token: "your Volcengine speech synthesis access_token"
    resource_id: "volc.service_type.10029"
    speaker: "zh_female_wanwanxiaohe_moon_bigtts"
    # Enable WebSocket reuse (reusing connections may occupy concurrency slots while idle)
    enable_ws_reuse: true
    # Advanced parameters; see: https://www.volcengine.com/docs/6561/1329505
    audio_params:
      speech_rate: 0      # Playback speed (-50~100)
      loudness_rate: 0    # Volume (-50~100)
      # Emotional parameters (only some voices support them)
      # See supported emotions: https://www.volcengine.com/docs/6561/1257544
      # emotion: "neutral"  # Emotion type (neutral, happy, sad, angry, fearful, disgusted, surprised)
      # emotion_scale: 4    # Emotion intensity (1~5)
    additions:
      post_process:
        pitch: 0          # Pitch shift (-12~12)
      # aigc_metadata: {}   # AIGC metadata configuration
      # cache_config: {}    # Cache configuration
    # Mixing control (only for TTS 1.0)
    # mix_speaker:
    #   speakers:
    #     - source_speaker: "zh_male_bvlazysheep"
