# This is an English "master-version" of .config.yaml with full content.
# ***** It needs cusomization for project-deployments! *****

# For development:

# Create a `data` directory under the project root directory, then create an empty file 
# named `.config.yaml` in the data directory. Then, modify the `.config.yaml` file 
# to override configurations instead of editing the `config.yaml` file.

# The system will prioritize reading the configuration from `data/.config.yaml`; if a setting
# is missing there, it will fall back to `config.yaml` (**the Chinese version, not this file!**).
# This config_en.yaml file mirrors the settings of the original config.yaml for reference.
# This simplifies configuration while protecting your secret keys.

# If you are using the xiaozhi-esp32-server Smart Console, the following configurations 
# will not take effect; modify them in the console instead.

# #######################################################################################
# ############################# Basic server configuration ##############################
# #######################################################################################
server:
  # Server listening address and port (Server listening address and port)
  ip: 0.0.0.0
  port: 8000
  # HTTP service port, used for simple OTA interface (single-service deployment) and visual analysis interface
  http_port: 8003
  # This WebSocket configuration is the WebSocket address that the OTA interface uses to send messages to devices.
  # By default, the OTA interface automatically generates a WebSocket address and prints it in the startup log; you can open this address in a browser to verify the OTA interface.
  # When deploying with Docker or using a public network (with SSL/domain), the address may not be accurate.
  # Therefore, if you are deploying with Docker, set the WebSocket to a LAN address.
  # If you are deploying on a public network, set the WebSocket to a public address.
  websocket: ws://<your ip or domain>:<port number>/xiaozhi/v1/
  # Visual analysis interface address
  # The interface address used to send visual analysis to devices.
  # By default, the system automatically generates a visual identification address and prints it in the startup log; you can open this address in a browser to verify.
  # When deploying with Docker or using a public network, the address may not be accurate.
  # Therefore, if you are deploying with Docker, set `vision_explain` to a LAN address.
  # If you are deploying on a public network, set `vision_explain` to a public address.
  vision_explain: http://<your ip or domain>:<port number>/mcp/vision/explain
  # OTA return information timezone offset, set according to your timezone
  timezone_offset: +8
  # Authentication configuration
  auth:
    # Whether authentication is enabled
    enabled: false
    # Whitelist of device IDs
    # Devices in the whitelist bypass token verification and are allowed direct access.
    allowed_devices:
      - "11:22:33:44:55:66"
  # MQTT gateway configuration, used to push commands to devices via OTA; format is host:port as defined in the mqtt_gateway .env file
  mqtt_gateway: null
  # MQTT signature key, used to generate the MQTT connection password; sourced from the mqtt_gateway .env file
  mqtt_signature_key: null
  # UDP gateway configuration
  udp_gateway: null

### Logging configuration
log:
# Log format for console output: timestamp, log level, tag, message
  log_format: "<green>{time:YYMMDD HH:mm:ss}</green>[{version}_{extra[selected_module]}][<light-blue>{extra[tag]}</light-blue>]-<level>{level}</level>-<light-green>{message}</light-green>"
# Log format for file output: timestamp, version, module, logger name, level, tag, message
  log_format_file: "{time:YYYY-MM-DD HH:mm:ss} - {version}_{extra[selected_module]} - {name} - {level} - {extra[tag]} - {message}"
  # Log level: INFO, DEBUG
  log_level: INFO
  # Log directory
  log_dir: tmp
  # Log file name
  log_file: "server.log"
  # Data file directory
  data_dir: data

### Basic Settings
# Delete the audio file after use (Delete the sound file when you are done using it)
delete_audio: true
# Disconnect after no voice input for this many seconds (default 120 seconds, i.e., 2 minutes)
close_connection_no_voice_time: 120
# TTS request timeout (seconds)
tts_timeout: 10
# Enable wake‑word acceleration
enable_wakeup_words_response_cache: true
# Whether to reply with a wake‑up word when greeting
enable_greeting: true
# Whether to play a prompt sound after finishing speaking
enable_stop_tts_notify: false
# Prompt sound after finishing speaking, audio file path
stop_tts_notify_voice: "config/assets/tts_notify.mp3"
# Enable WebSocket ping keep‑alive mechanism
enable_websocket_ping: false

### TTS audio send delay configuration
# tts_audio_send_delay: Controls the interval between audio packet sends
#   0: Use precise timing, strictly match the audio frame rate (default; runtime calculates based on audio frame rate)
#   > 0: Use a fixed delay (milliseconds); e.g., 60
tts_audio_send_delay: 0

exit_commands:  # **!!!** Translated from Chinese config.yaml for readability **!!!**
  - "exit"
  - "close"

xiaozhi:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    # Opus supported sample rates: [8000, 12000, 16000, 24000, 48000]
    sample_rate: 24000
    channels: 1
    frame_duration: 60

### Module test configuration
module_test:
  test_sentences: # **!!!** Translated from Chinese config.yaml for readability **!!!**
    - "Hello, please introduce yourself."
    - "What's the weather like today?"
    - "Please summarize the basic principles and application prospects of quantum computing in 100 characters."

### Wake‑up words for detecting wake‑up words vs. regular speech
wakeup_words: # **!!!** Translated from Chinese config.yaml for readability **!!!**
  - "hello xiaozhi"
  - "hey hey"
  - "hello xiaozhi"
  - "little ai classmate"
  - "hello xiaoxin"
  - "hello xiaoxin"
  - "little mei classmate"
  - "xiaolong xiaolong"
  - "kitten classmate"
  - "xiao bin xiao bin"
  - "xiaobing xiaobing"

### MCP endpoint address; format: ws://your MCP endpoint ip or domain:port number/mcp/?token=your token
# Detailed guide: https://github.com/xinnan-tech/xiaozhi-esp32-server/blob/main/docs/mcp-endpoint-integration.md
mcp_endpoint: <your access point websocket address>

### Context source configuration
# Used to inject dynamic data (e.g., health data, stock information) into the system prompt.
# Multiple context providers can be added.
context_providers:
  - url: ""
    headers:
      Authorization: ""

### Plugin base configuration
plugins:
  # Weather plugin configuration; fill in your api_key here.
  # This key is shared among projects; excessive use may trigger rate limits.
  # Apply for your own key if you need higher stability; daily free quota is 1000 calls.
  # Application portal: https://console.qweather.com/#/apps/create-key/over
  # After applying, retrieve your apihost via: https://console.qweather.com/setting?lang=zh
  get_weather:
    api_host: "mj7p3y7naa.re.qweatherapi.com"
    api_key: "a861d0d5e7bf4ee1a83d9a9e4f96d4da"
    default_location:  "广州" # "Guangzhou" as Default location for weather queries
  # News plugin configuration; provide the URL(s) for the news type you need.
  # By default it supports society, tech, and finance news.
  # More news types: https://www.chinanews.com.cn/rss/
  get_news_from_chinanews:
    default_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    society_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    world_rss_url: "https://www.chinanews.com.cn/rss/world.xml"
    finance_rss_url: "https://www.chinanews.com.cn/rss/finance.xml"
  get_news_from_newsnow:
    url: "https://newsnow.busiyi.world/api/s?id="
    news_sources: "澎湃新闻;百度热搜;财联社" # Panjian News; Baidu Hot Search; Cailian Press"
  home_assistant:
    devices: # **!!!** Translated from Chinese config.yaml for readability **!!!**
      - "living room, toy light, switch.cuco_cn_460494544_cp1_on_p_2_1"
      - "bedroom, lamp, switch.iot_cn_831898993_socn1_on_p_2_1"
    base_url: "http://homeassistant.local:8123"
    api_key: "<your Home Assistant API access token>"
  play_music:
    music_dir: "./music"  # Path where music files are stored; the system will search this directory and its subdirectories for music files.
    music_ext:  # Supported music extensions; .p3 format is the most efficient.
      - ".mp3"
      - ".wav"
      - ".p3"
    refresh_time: 300 # Refresh interval for the music list, in seconds
  search_from_ragflow: # **!!!** Translated from Chinese config.yaml for readability **!!!**
    # Description of the knowledge base, helping the LLM know when to use it.
    description: "When the user asks xxx, call this method and answer the question using the knowledge base information."
    # RAGFlow API configuration
    base_url: "<your url, e.g. http://192.168.0.8>"
    # RAGFlow API token
    api_key: "ragflow-xxx"
    # RAGFlow knowledge base ID(s)
    dataset_ids: ["123456789"]

### Voiceprint configuration
voiceprint:
  # Voiceprint interface address
  url: <your url>
  # Speaker configurations: speaker_id, name, description
  speakers: # **!!!** Translated from Chinese config.yaml for readability **!!!**
    - "test1, Zhang San, Zhang San is a programmer"
    - "test2, Li Si, Li Si is a product manager"
    - "test3, Wang Wu, Wang Wu is a designer"
  # Similarity threshold for voiceprint recognition, range 0.0‑1.0; default 0.4.
  # Higher values are stricter, reducing false positives but increasing reject rate.
  similarity_threshold: 0.4

